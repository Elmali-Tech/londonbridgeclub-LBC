name: CI/CD

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: lbc-production-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Production build
        run: npm run build

  deploy:
    name: Deploy to Cloud Run
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      REGION: ${{ vars.GCP_REGION }}
      REPOSITORY: ${{ vars.GCP_ARTIFACT_REPOSITORY }}
      SERVICE: ${{ vars.GCP_CLOUD_RUN_SERVICE }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v3

      - name: Configure Artifact Registry authentication
        run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      - name: Build and push image
        id: image
        shell: bash
        run: |
          set -euo pipefail
          image="${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPOSITORY}/lbc-web:${GITHUB_SHA}"
          candidate_tag="candidate-${GITHUB_SHA::7}"

          docker build \
            --tag "${image}" \
            --build-arg "NEXT_PUBLIC_SUPABASE_URL=${{ vars.NEXT_PUBLIC_SUPABASE_URL }}" \
            --build-arg "NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}" \
            --build-arg "NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=${{ vars.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}" \
            --build-arg "NEXT_PUBLIC_BASE_URL=${{ vars.NEXT_PUBLIC_BASE_URL }}" \
            --build-arg "NEXT_PUBLIC_AWS_REGION=${{ vars.NEXT_PUBLIC_AWS_REGION }}" \
            --build-arg "NEXT_PUBLIC_AWS_S3_BUCKET_NAME=${{ vars.NEXT_PUBLIC_AWS_S3_BUCKET_NAME }}" \
            --build-arg "NEXT_PUBLIC_AWS_S3_URL=${{ vars.NEXT_PUBLIC_AWS_S3_URL }}" \
            --build-arg "NEXT_PUBLIC_SUPABASE_STORAGE_BUCKET=${{ vars.NEXT_PUBLIC_SUPABASE_STORAGE_BUCKET }}" \
            .
          docker push "${image}"

          echo "image=${image}" >> "${GITHUB_OUTPUT}"
          echo "candidate_tag=${candidate_tag}" >> "${GITHUB_OUTPUT}"

      - name: Deploy candidate revision
        env:
          IMAGE: ${{ steps.image.outputs.image }}
          CANDIDATE_TAG: ${{ steps.image.outputs.candidate_tag }}
        shell: bash
        run: |
          set -euo pipefail
          gcloud run deploy "${SERVICE}" \
            --project "${PROJECT_ID}" \
            --region "${REGION}" \
            --platform managed \
            --image "${IMAGE}" \
            --no-traffic \
            --tag "${CANDIDATE_TAG}" \
            --quiet

          candidate_url="$(
            gcloud run services describe "${SERVICE}" \
              --project "${PROJECT_ID}" \
              --region "${REGION}" \
              --format=json |
              jq -r --arg tag "${CANDIDATE_TAG}" '.status.traffic[] | select(.tag == $tag) | .url'
          )"
          test -n "${candidate_url}"
          curl --fail --silent --show-error --retry 6 --retry-delay 5 \
            "${candidate_url}/api/health"

      - name: Promote candidate to production
        shell: bash
        run: |
          set -euo pipefail
          gcloud run services update-traffic "${SERVICE}" \
            --project "${PROJECT_ID}" \
            --region "${REGION}" \
            --to-latest \
            --quiet

          service_url="$(
            gcloud run services describe "${SERVICE}" \
              --project "${PROJECT_ID}" \
              --region "${REGION}" \
              --format='value(status.url)'
          )"
          curl --fail --silent --show-error --retry 6 --retry-delay 5 \
            "${service_url}/api/health"
